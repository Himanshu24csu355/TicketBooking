<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Book Ticket</title>
</head>

<body>

    <h1>Ticket Booking</h1>

    <form th:action="@{/book-ticket}"
          th:object="${passenger}"
          method="post">

        <label>Name:</label>
        <input type="text"
               th:field="*{name}"
               required>

        <br><br>

        <label>Departure:</label>
        <input type="text"
               th:field="*{departure}"
               required>

        <br><br>

        <label>Arrival:</label>
        <input type="text"
               th:field="*{arrival}"
               required>

        <br><br>

        <label>Date of Journey:</label>
        <input type="date"
               th:field="*{dateOfJourney}"
               required>

        <br><br>

        <button type="submit">
            Book Ticket
        </button>

    </form>

    <br>

    <div th:if="${ticketNumber != null}">

        <h2>Ticket Booked Successfully!</h2>

        <p>
            Your Ticket Number is:
            <strong th:text="${ticketNumber}"></strong>
        </p>

    </div>

    <br>

    <a th:href="@{/ticket-form}">
        Get Full Ticket Details
    </a>

</body>

</html>
